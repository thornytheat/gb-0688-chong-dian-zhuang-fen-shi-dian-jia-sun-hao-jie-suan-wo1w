{% extends "base.html" %}{% block content %}<div class="split-workbench"><section class="panel"><div class="panel__head"><h2>计量导入</h2></div><form id="meter-form"><label>CSV<textarea name="text" spellcheck="false">{{sample}}</textarea></label><label>选择文件<input name="file" type="file" accept=".csv"></label><div class="control-grid"><label>损耗价 CNY/kWh<input name="loss_rate" value="{{defaults.loss_rate}}"></label><label>差额容差 CNY<input name="bill_tolerance" value="{{defaults.bill_tolerance}}"></label></div><button class="btn solid">重算电费</button></form></section><div class="stack"><section class="panel"><div class="panel__head"><h2>原始读数</h2><span>{{data.rows|length}} 行</span></div>{{grid(data.rows,['id','station','kind','energy','unit','bill'])}}</section><section class="panel"><div class="panel__head"><h2>隔离依据</h2></div>{{grid(result.quarantine,['line','key','code','reason'])}}</section></div></div>{% endblock %}
